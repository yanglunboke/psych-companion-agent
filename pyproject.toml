[project]
name = "psych-companion-agent"
version = "0.1.0"
description = "中学积极心理陪伴智能体 —— 4 WORKERS 编排 / 情绪轨迹 / 按需资源建议 / 高危固定上报流程"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "agentscope>=2.0,<3.0",
    "numpy>=1.26",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
