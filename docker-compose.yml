# Postgres + pgvector（用于语义向量持久化）
# 用法：docker compose up -d
# 连接串：postgresql+psycopg://psych:psych@localhost:5433/psych
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: psych-pgvector
    environment:
      POSTGRES_USER: psych
      POSTGRES_PASSWORD: psych
      POSTGRES_DB: psych
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psych -d psych"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector_data:
